apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

// Ortak yapilandirma dosyasi (common/config.json) - Tek ve zorunlu kaynak
def configFile = rootProject.file("../common/config.json")
if (!configFile.exists()) {
    throw new GradleException("HATA: android_ios/common/config.json dosyasi bulunamadi!")
}
def mobileConfig = new JsonSlurper().parse(configFile)

// Release imza bilgileri repoda tutulmaz (repo public). Yol ASPAR2_KEYSTORE_PROPS ortam
// degiskeninden ya da android/keystore.properties dosyasindan okunur.
def keystorePropsPath = System.getenv("ASPAR2_KEYSTORE_PROPS") ?: rootProject.file("keystore.properties").path
def keystoreProps = new Properties()
def keystorePropsFile = new File(keystorePropsPath)
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.metin2.client"
    compileSdkVersion 36
    buildToolsVersion "35.0.0"
    ndkVersion "28.2.13676358"

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        applicationId mobileConfig.package_name
        minSdkVersion 24
        targetSdkVersion 36
        versionCode mobileConfig.version_code as Integer
        versionName mobileConfig.version_name

        manifestPlaceholders = [appName: mobileConfig.game_name]
        buildConfigField "String", "UPDATE_BASE_URL", "\"${mobileConfig.patcher_url}\""
        buildConfigField "String", "CRCLIST_NAME", "\"${mobileConfig.crclist_name}\""
        buildConfigField "String", "PACK_DIR_NAME", "\"${mobileConfig.pack_dir_name}\""
        buildConfigField "String", "GAME_NAME", "\"${mobileConfig.game_name}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fomit-frame-pointer -frtti -fexceptions -fdeclspec -fms-extensions -fno-strict-aliasing -Wno-invalid-source-encoding -Wno-register -D_GNU_SOURCE -D_LIBCPP_ENABLE_CXX17_REMOVED_FEATURES"
                cFlags "-std=gnu99"
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_TOOLCHAIN=clang"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['../../common/assets']
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../../CMakeLists.txt")
        }
    }

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libmetin2_mobile.so'
        pickFirst 'lib/arm64-v8a/libmetin2_mobile.so'
        pickFirst 'lib/x86/libmetin2_mobile.so'
        pickFirst 'lib/x86_64/libmetin2_mobile.so'
    }

    aaptOptions {
        noCompress 'data', 'index', 'epk', 'eix', 'raw', 'dat'
    }

    compileOptions {
        encoding = 'UTF-8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            if (variant.buildType.name == "release") {
                outputFileName = "${mobileConfig.game_name}.apk"
            } else {
                outputFileName = "${mobileConfig.game_name}-${variant.name}.apk"
            }
        }
    }
}

tasks.register('syncBranding', Copy) {
    from '../../common/branding'
    include 'bg_loading.jpg', 'logo.png'
    into 'src/main/res/drawable-nodpi'
}
preBuild.dependsOn syncBranding

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
