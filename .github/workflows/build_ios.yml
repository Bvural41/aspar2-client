name: Build Aspar2 iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'source/**'
      - 'android_compat/**'
      - 'extern/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Configure CMake for iOS
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO

      - name: Build and Archive iOS App
        run: |
          xcodebuild -project build-ios/Metin2Mobile.xcodeproj \
            -scheme Aspar2 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build-ios/Aspar2.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p build-ios/Payload
          cp -r build-ios/Aspar2.xcarchive/Products/Applications/Aspar2.app build-ios/Payload/
          cd build-ios
          zip -r Aspar2.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aspar2-iOS-Release
          path: build-ios/Aspar2.ipa
          retention-days: 14
