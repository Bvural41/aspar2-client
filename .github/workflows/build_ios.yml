name: Build Metin2Mobile iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android_ios/**'
      - 'source/**'
      - 'extern/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build_ios.yml'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Sync App Info and Build Number
        run: |
          python3 -c "import json, plistlib; c=json.load(open('android_ios/common/config.json')); p=plistlib.load(open('android_ios/ios/Info.plist','rb')); p['CFBundleDisplayName']=c.get('game_name', p.get('CFBundleDisplayName','Aspar2')); p['CFBundleShortVersionString']=c.get('version_name', p.get('CFBundleShortVersionString','1.0')); p['CFBundleVersion']='${{ github.run_number }}'; p['ITSAppUsesNonExemptEncryption']=False; plistlib.dump(p, open('android_ios/ios/Info.plist','wb'))"

      - name: Configure CMake for iOS
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO

      - name: Build and Archive iOS App
        run: |
          xcodebuild -project build-ios/Metin2Mobile.xcodeproj \
            -scheme Metin2Mobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build-ios/Metin2Mobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Prepare App Store Connect API Key
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Export Signed IPA
        run: |
          cat > build-ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build-ios/Metin2Mobile.xcarchive \
            -exportPath build-ios/export \
            -exportOptionsPlist build-ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}
          ls -la build-ios/export

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metin2Mobile-iOS-Release
          path: build-ios/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        run: |
          IPA_PATH=$(ls build-ios/export/*.ipa | head -1)
          echo "Uploading $IPA_PATH to TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            --type ios \
            --apiKey ${{ secrets.APPSTORE_KEY_ID }} \
            --apiIssuer ${{ secrets.APPSTORE_ISSUER_ID }}
